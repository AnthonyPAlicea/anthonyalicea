<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Dump</title>
<meta name="description" content="A feature request arrives. Sort what is in your head into the five categories a spec needs. About three minutes.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ----------
   Light-only system built from the DESIGN.md structure (light tinted ground, white surfaces, charcoal
   text, one bright primary, hard bottom edges, 12/16px radii) with its own palette: mint ground,
   golden primary, deep teal for headings and the course card, a pink brain, and five category
   colors that stay clear of the primary. */
:root {
  color-scheme: light;
  --bg: #e6f6ee;
  --bg-2: #f1faf5;
  --surface: #fdfffe;
  --ink: #333d39;
  --muted: #5d6f68;
  --rule: #c5e6d6;
  --rule-2: #a3d4be;
  --primary: #ffd23f;
  --primary-hover: #ffdb5f;
  --primary-edge: #e3b01a;
  --on-primary: #1c1c1c;
  --accent: #0f4c45;
  --accent-text: #0f4c45;
  --brand: #0f4c45;
  --brand-edge: #0a332e;
  --brain-fill: #ffe6ec;
  --brain-stroke: #333d39;
  --c-constraints: #ef4f3f; --t-constraints: #b52e22;
  --c-facts: #3d5af1;       --t-facts: #2a43c4;
  --c-unknowns: #a560f5;    --t-unknowns: #7a35d6;
  --c-deliverable: #2eaa5a; --t-deliverable: #1f7a41;
  --c-gut: #ec4f9f;         --t-gut: #b0246f;
  --sans: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  --radius: 16px;
  --radius-sm: 12px;
  --dur: .3s;
  --ease: ease;
  --notebook-w: 360px;
  --sheet-peek: 56px;
}
[data-cat="constraints"] { --cat: var(--c-constraints); --cat-text: var(--t-constraints); }
[data-cat="facts"]       { --cat: var(--c-facts);       --cat-text: var(--t-facts); }
[data-cat="unknowns"]    { --cat: var(--c-unknowns);    --cat-text: var(--t-unknowns); }
[data-cat="deliverable"] { --cat: var(--c-deliverable); --cat-text: var(--t-deliverable); }
[data-cat="gut"]         { --cat: var(--c-gut);         --cat-text: var(--t-gut); }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--sans); font-weight: 800; margin: 0; line-height: 1.15; letter-spacing: -0.01em; color: var(--brand); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent-text); }
kbd { font-family: var(--mono); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 3px; border-radius: 6px; }

/* ---------- masthead + rail ---------- */
.masthead {
  max-width: 1180px; margin: 0 auto; padding: 22px 24px 4px;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.masthead h1 { font-size: 24px; }
.masthead p { color: var(--muted); font-size: 14px; font-weight: 500; }

.rail { max-width: 1180px; margin: 0 auto; padding: 10px 24px 22px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 8px; }
.rail li { position: relative; }
.rail .rail-step {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0;
  color: var(--muted); cursor: default; border-radius: 0;
}
.rail .rail-step::before { content: ""; display: block; height: 8px; border-radius: 4px; background: var(--rule-2); margin-bottom: 8px; transition: background var(--dur) var(--ease); }
.rail .rail-step b { display: block; font-weight: 700; color: var(--muted); font-size: 13px; }
.rail li[aria-current="step"] .rail-step::before { background: var(--accent); }
.rail li[aria-current="step"] .rail-step b { color: var(--brand); }
.rail li.is-done .rail-step::before { background: var(--primary-edge); }
.rail.is-dev .rail-step { cursor: pointer; }
@media (max-width: 700px) {
  .rail ol { gap: 5px; }
  .rail .rail-step::before { height: 6px; margin-bottom: 6px; }
  .rail .rail-step b { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail li:not([aria-current]) .rail-step b { color: transparent; position: relative; }
  .rail li:not([aria-current]) .rail-step b::before { content: attr(data-n); position: absolute; left: 0; color: var(--muted); }
}

/* ---------- layout ---------- */
.layout {
  max-width: 1180px; margin: 0 auto; padding: 0 24px 140px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px;
}
main { min-width: 0; }
section[data-step] { animation: none; }

.step-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.step-head h2 { font-size: 24px; }
.step-head .skip { margin-left: auto; background: none; border: 0; color: var(--accent-text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 6px 0; }
.step-head .skip:hover { color: var(--brand); }
.step-head .lede { flex: 1 0 100%; margin: 0 0 6px; font-weight: 500; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primary); color: var(--on-primary); border: 0;
  padding: 12px 20px; min-height: 44px; border-radius: var(--radius-sm);
  font-weight: 700; font-size: 14px; line-height: 1.2; letter-spacing: .8px; text-transform: uppercase;
  box-shadow: 0 4px 0 var(--primary-edge); text-decoration: none;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.btn:hover { background: var(--primary-hover); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--primary-edge); }
.btn.secondary { background: var(--surface); color: var(--accent-text); border: 2px solid var(--rule-2); box-shadow: 0 3px 0 var(--rule-2); }
.btn.secondary:hover { background: var(--surface); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
.btn.secondary:active { transform: translateY(3px); box-shadow: 0 0 0 var(--accent); }
.btn.link { background: none; border: 0; box-shadow: none; color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; font-weight: 600; font-size: 14px; letter-spacing: 0; text-transform: none; }
.btn.link:hover { color: var(--brand); }
.btn.link:active { transform: none; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn[disabled]:active { transform: none; box-shadow: 0 4px 0 var(--primary-edge); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 18px; }

/* ---------- request step ---------- */
.chat {
  display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; align-items: start;
  max-width: 560px; margin: 0 auto 18px; text-align: left;
}
.chat .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #f3fbf7; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.chat .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.chat .meta b { color: var(--ink); font-weight: 700; }
.chat .bubble {
  display: inline-block; background: var(--surface); border: 2px solid var(--rule); border-radius: 4px 16px 16px 16px;
  padding: 12px 16px; font-size: 16px; line-height: 1.45; font-weight: 500; box-shadow: 0 3px 0 var(--rule-2);
}

.intro { max-width: 720px; margin: 0 auto 20px; text-align: center; }
.intro .context { font-size: 18px; line-height: 1.45; font-weight: 500; margin: 4px 0 12px; }

.brain-wrap { position: relative; max-width: 600px; margin: 0 auto; }
#brainSvg { width: 100%; height: auto; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#brainSvg.is-dragging { cursor: grabbing; }
#brainSvg.is-tipped { cursor: default; }
#brainSvg .lobe { fill: var(--brain-fill); stroke: var(--brain-stroke); stroke-width: 3.2; stroke-linejoin: round; }
#brainSvg .fissure { fill: none; stroke: rgba(60,60,60,.45); stroke-width: 1.8; stroke-linecap: round; }
#brainSvg .folia { fill: none; stroke: rgba(60,60,60,.25); stroke-width: 1.4; stroke-linecap: round; }
#brainSvg .fold { fill: none; stroke: rgba(60,60,60,.12); stroke-width: 1; }
#brainSvg text { font-family: var(--sans); font-weight: 600; fill: var(--ink); }
.brain-caption { display: flex; justify-content: center; margin-top: 10px; }

.explain { font-size: 18px; line-height: 1.45; font-weight: 500; }
@media (max-width: 700px) { .explain, .intro .context { font-size: 17px; } }

/* ---------- glyphs ---------- */
.glyph svg { width: 100%; height: 100%; display: block; }

/* ---------- desk: heap, stage, buttons ---------- */
#desk { margin-top: 8px; }
#stage { position: relative; margin-bottom: 20px; }
#focus {
  position: relative; min-height: 170px; display: grid; place-items: center; padding: 28px 32px;
  background: var(--surface); border: 2px solid var(--rule); border-radius: var(--radius); box-shadow: 0 3px 0 var(--rule-2);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  overflow: visible;
}
#focus::before { content: none; }
#focus.has-cat { border-color: var(--cat); box-shadow: 0 3px 0 var(--cat); }
#focus .placeholder { color: var(--muted); font-size: 18px; font-weight: 500; }

.thought {
  font-family: var(--sans); font-size: 14.5px; line-height: 1.3; font-weight: 500; color: var(--ink);
  background: var(--surface); border: 2px solid var(--rule); border-radius: var(--radius-sm);
  padding: 6px 12px; box-shadow: 0 2px 0 var(--rule-2);
  max-width: 280px; width: max-content; will-change: transform;
}
#heap .thought { position: absolute; cursor: default; }
.thought.is-falling { position: absolute; z-index: 60; }
.thought.is-focus {
  position: static; max-width: 100%; width: auto; background: none; border: 0; box-shadow: none; padding: 0;
  font-size: clamp(26px, 3.6vw, 40px); line-height: 1.15; text-align: center; font-weight: 700; letter-spacing: -0.01em;
  text-wrap: balance;
}
.thought.is-entry {
  position: static; max-width: 100%; width: auto; background: none; border: 0; box-shadow: none; padding: 0;
  font-size: 14.5px; line-height: 1.35; font-weight: 500;
}

#heap {
  position: relative; min-height: 120px; border-radius: var(--radius);
  background: rgba(253,255,254,.5);
  border: 2px dashed var(--rule-2);
}
#heap.is-empty { display: none; }
#fallLayer { position: absolute; left: 0; top: 0; width: 100%; height: 0; overflow: visible; pointer-events: none; z-index: 50; }

.cat-buttons { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-top: 14px; }
.cat-btn {
  position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  padding: 12px 12px 11px; background: var(--surface); border: 2px solid var(--rule); border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--rule-2); text-align: left; min-height: 78px;
  transition: transform .15s var(--ease), border-color var(--dur) var(--ease), box-shadow .15s var(--ease), background var(--dur) var(--ease);
}
.cat-btn::before { content: ""; position: absolute; inset: 0; background: var(--cat); transform: scaleX(0); transform-origin: left; opacity: .14; transition: transform var(--dur) var(--ease); pointer-events: none; }
.cat-btn.is-sweep::before { transform: scaleX(1); }
.cat-btn:hover { border-color: var(--cat); box-shadow: 0 3px 0 var(--cat); }
.cat-btn:active, .cat-btn.is-pressed { transform: translateY(3px); border-color: var(--cat); box-shadow: 0 0 0 var(--cat); }
.cat-btn.is-pressed { background: color-mix(in srgb, var(--cat) 10%, var(--surface)); }
.cat-btn.is-pulse { outline: 3px solid transparent; animation: pulse-outline 1.1s ease-out 2; }
@keyframes pulse-outline { 0% { outline-color: var(--cat); outline-offset: 0; } 70% { outline-color: transparent; outline-offset: 8px; } 100% { outline-color: transparent; outline-offset: 8px; } }
.cat-btn .glyph { width: 22px; height: 22px; color: var(--cat); }
.cat-btn .name { font-size: 13px; font-weight: 700; color: var(--cat-text); line-height: 1.2; }
.cat-btn kbd { position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 600; color: var(--muted); border: 1.5px solid var(--rule); border-radius: 6px; padding: 0 5px; line-height: 16px; background: var(--bg-2); }
.cat-btn[disabled] { cursor: default; }
.cat-btn[disabled]:hover { border-color: var(--rule); box-shadow: 0 3px 0 var(--rule-2); }
@media (max-width: 700px) {
  .cat-buttons { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .cat-buttons .cat-btn:nth-child(5) { grid-column: 1 / -1; min-height: 56px; flex-direction: row; align-items: center; }
}

.stage-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; min-height: 32px; }
.stage-foot .progress { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.stage-foot .spacer { flex: 1; }

.scribe {
  margin-top: 16px; min-height: 3.2em; display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; align-items: start;
  font-size: 17px; line-height: 1.4; font-weight: 500; color: var(--ink);
}
.scribe .pen { width: 22px; height: 22px; color: var(--accent-text); margin-top: 2px; }
.scribe .line { opacity: 0; }
.scribe.is-wrong .line { color: var(--t-constraints); }

.callout {
  position: absolute; inset: -6px; z-index: 20; display: grid; place-items: center; padding: 16px;
  background: rgba(230,246,238,.88); backdrop-filter: blur(2px); border-radius: var(--radius);
}
.callout .card {
  background: var(--surface); border: 2px solid var(--cat, var(--rule-2)); border-radius: var(--radius); padding: 20px 22px;
  max-width: 560px; box-shadow: 0 4px 0 var(--cat, var(--rule-2));
}
.callout .card p { font-size: 17px; line-height: 1.45; font-weight: 500; }
.callout .card .btn-row { margin-top: 14px; }
.callout .card ul.pick { list-style: none; margin: 12px 0 0; padding: 0; max-height: 40vh; overflow: auto; }
.callout .card ul.pick li { margin: 0; }
.callout .card ul.pick button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 2px solid var(--rule); border-radius: 0; padding: 10px 8px; font-size: 15px; font-weight: 500; }
.callout .card ul.pick button:hover { background: var(--bg-2); }
.callout .card ul.pick .tag { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--cat-text); margin-right: 8px; }

/* not sure panel */
.notsure {
  position: absolute; right: 0; top: 0; width: min(380px, 100%); z-index: 25;
  background: var(--surface); border: 2px solid var(--rule-2); border-radius: var(--radius); box-shadow: 0 4px 0 var(--rule-2); padding: 18px 20px;
}
.notsure .q { font-size: 18px; line-height: 1.35; font-weight: 600; min-height: 2.6em; padding-right: 28px; }
.notsure .btn-row { margin-top: 12px; }
.notsure .close { position: absolute; right: 8px; top: 6px; background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 6px 10px; }
.notsure .close:hover { color: var(--ink); }

/* ---------- decide ---------- */
.deliv-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
@media (max-width: 560px) { .deliv-grid { grid-template-columns: minmax(0,1fr); } }
.deliv-card {
  text-align: left; background: var(--surface); border: 2px solid var(--rule); border-radius: var(--radius-sm); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px; box-shadow: 0 3px 0 var(--rule-2);
  transition: border-color var(--dur) var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease), background var(--dur) var(--ease);
}
.deliv-card:hover { border-color: var(--c-deliverable); box-shadow: 0 3px 0 var(--c-deliverable); }
.deliv-card:active { transform: translateY(3px); box-shadow: 0 0 0 var(--c-deliverable); }
.deliv-card.is-selected { border-color: var(--c-deliverable); box-shadow: 0 3px 0 var(--c-deliverable); background: color-mix(in srgb, var(--c-deliverable) 10%, var(--surface)); }
.deliv-card b { font-size: 18px; font-weight: 700; color: var(--t-deliverable); }
.deliv-card span { color: var(--muted); font-size: 14px; font-weight: 500; }
.deliv-card[disabled] { opacity: .55; cursor: default; }
.deliv-card[disabled]:hover, .deliv-card[disabled]:active { transform: none; border-color: var(--rule); box-shadow: 0 3px 0 var(--rule-2); }
.deliv-card[disabled].is-selected { opacity: 1; border-color: var(--c-deliverable); box-shadow: 0 3px 0 var(--c-deliverable); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.chip {
  background: var(--surface); border: 2px solid var(--rule); border-radius: var(--radius-sm); padding: 10px 14px;
  font-size: 14.5px; font-weight: 500; text-align: left; line-height: 1.3; box-shadow: 0 3px 0 var(--rule-2);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
}
.chip:hover { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
.chip:active { transform: translateY(3px); box-shadow: 0 0 0 var(--accent); }
.chip.is-picked { border-color: var(--primary-edge); background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 var(--primary-edge); font-weight: 600; }
.chip.ghost { border-style: dashed; color: var(--muted); box-shadow: none; }
.chip.ghost:hover { box-shadow: none; }
.chip[disabled] { opacity: .55; cursor: default; }
.chip[disabled]:hover, .chip[disabled]:active { transform: none; border-color: var(--rule); box-shadow: 0 3px 0 var(--rule-2); }
.chip[disabled].is-picked { opacity: 1; border-color: var(--primary-edge); box-shadow: 0 3px 0 var(--primary-edge); }
.reason-label { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 16px; text-transform: uppercase; letter-spacing: .8px; }

/* ---------- review ---------- */
.review-block { margin-top: 32px; padding-top: 24px; border-top: 2px solid var(--rule); }
.review-block:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
.review-block h3 { font-size: 22px; margin-bottom: 8px; }
.doc-inline { margin-top: 12px; }

.cta { background: var(--brand); color: #f3fbf7; border-radius: var(--radius); padding: 28px 30px; box-shadow: 0 4px 0 var(--brand-edge); }
.cta h3 { color: #f3fbf7; margin-bottom: 10px; }
.cta p { font-size: 17px; line-height: 1.5; font-weight: 500; max-width: 62ch; color: #d4ece2; }
.cta .btn { margin-top: 18px; }

/* ---------- document (Markdown preview, so it stays monospaced) ---------- */
.doc {
  font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--ink); font-weight: 500;
  background: var(--surface); border: 2px solid var(--rule); border-radius: var(--radius); padding: 20px 22px;
  overflow-wrap: anywhere;
}
.doc .h1 { font-weight: 700; font-size: 14px; color: var(--brand); margin-bottom: 2px; }
.doc .date { color: var(--muted); margin-bottom: 14px; }
.doc .h2 { font-weight: 700; margin: 14px 0 4px; color: var(--cat-text); }
.doc .note { color: var(--muted); }
.doc ul { list-style: none; margin: 0; padding: 0; }
.doc li { padding-left: 1.4em; text-indent: -1.4em; }
.doc li::before { content: "- "; color: var(--muted); }
.doc .flag { color: var(--muted); }
.doc .empty { color: var(--muted); }
.doc hr { border: 0; border-top: 2px solid var(--rule); margin: 14px 0; }
.doc .next b { font-weight: 700; }

/* ---------- notebook ---------- */
.notebook-wrap { position: relative; min-width: 0; }
#notebook { position: relative; }
.nb-face { background: var(--surface); border: 2px solid var(--rule); border-radius: var(--radius); box-shadow: 0 3px 0 var(--rule-2); }
.nb-front { padding: 18px 18px 22px; }
.nb-back { padding: 0; }
.nb-back .doc { border: 0; border-radius: var(--radius); }
.nb-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.nb-title h2 { font-size: 18px; }
.nb-title small { font-size: 12px; font-weight: 700; color: var(--muted); }
.nb-section { padding: 10px 0 8px; border-top: 2px solid var(--rule); }
.nb-section h3 { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--cat-text); }
.nb-section h3 .glyph { width: 16px; height: 16px; color: var(--cat); }
.nb-section h3 .count { margin-left: auto; font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: 0; }
.nb-section ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }

.nb-section li.is-added { border-left-style: dotted; }

.nb-section .empty-note { font-size: 13px; color: var(--muted); margin-top: 6px; padding-left: 12px; font-weight: 500; }
.nb-peek { display: none; }

/* desktop: sticky right column, 3D flip */
@media (min-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr) var(--notebook-w); }

  .nb-face { position: absolute; inset: 0; overflow: auto; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .nb-back { transform: rotateY(180deg); }
  #notebook.is-flipped { transform: rotateY(180deg); }
  html.reduced-motion #notebook { transition: none; }
}

/* tablet: drawer from the right */
@media (min-width: 700px) and (max-width: 1099.98px) {
  .notebook-wrap {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--notebook-w), 88vw); z-index: 40;
    transform: translateX(100%); transition: transform var(--dur) var(--ease);
  }
  .notebook-wrap.is-open { transform: translateX(0); }
  #notebook { height: 100%; }
  .nb-face { height: 100%; overflow: auto; border-radius: 0; border-right: 0; box-shadow: none; }
  .nb-back { display: none; }
  .nb-peek {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    position: absolute; left: -48px; top: 30%; width: 48px; padding: 12px 0; background: var(--surface);
    border: 2px solid var(--rule); border-right: 0; border-radius: var(--radius-sm) 0 0 var(--radius-sm); box-shadow: 0 3px 0 var(--rule-2); cursor: pointer;

  .nb-peek .dots { display: flex; flex-direction: column; gap: 6px; }
}

/* phone: bottom sheet */
@media (max-width: 699.98px) {
  .notebook-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; height: min(80vh, 640px); z-index: 40;
    transform: translateY(calc(100% - var(--sheet-peek))); transition: transform var(--dur) var(--ease);
  }
  .notebook-wrap.is-open { transform: translateY(0); }
  #notebook { height: 100%; display: flex; flex-direction: column; }
  .nb-peek {

  .nb-peek .dots { display: flex; gap: 10px; }
  .nb-face { flex: 1; overflow: auto; border-radius: 0; border-left: 0; border-right: 0; box-shadow: none; }
  .nb-back { display: none; }
  .layout { padding-bottom: 120px; }
}

async function loadContent() {

      if (!r.ok) throw new Error('HTTP ' + r.status);

}
function validate(c) {
  const errors = [], warnings = [];
  const catIds = new Set((c.categories || []).map(x => x.id));
  const req = ['meta', 'request', 'steps', 'categories', 'notSure', 'thoughts', 'coaching', 'emptyCategory', 'deliverable', 'review', 'ui'];
  req.forEach(k => { if (!(k in c)) errors.push(`missing top-level key: ${k}`); });
  if (!c.thoughts) return { errors, warnings };
  const ids = new Set();
  let demos = 0, stumbles = 0, demosAtTop = true, seenNonDemo = false;
  c.thoughts.forEach((t, i) => {
    if (!t.id) errors.push(`thought #${i} has no id`);
    if (!t.text) errors.push(`thought ${t.id || '#' + i} has no text`);
    if (ids.has(t.id)) errors.push(`duplicate thought id ${t.id}`);
    ids.add(t.id);
    const acc = Array.isArray(t.accept) ? t.accept : [];
    if (acc.length < 1 || acc.length > 2) errors.push(`${t.id}: accept must have 1 or 2 entries`);
    acc.forEach(a => { if (!catIds.has(a)) errors.push(`${t.id}: accept has unknown category ${a}`); });
    if ((acc.length === 2) !== !!t.twoWay) errors.push(`${t.id}: twoWay must be true exactly when accept has two entries`);
    if (t.demo) { demos++; if (seenNonDemo) demosAtTop = false; } else seenNonDemo = true;
    if (t.stumble) stumbles++;
    if (t.wrongCoaching) Object.keys(t.wrongCoaching).forEach(k => { if (!catIds.has(k)) errors.push(`${t.id}: wrongCoaching key ${k} is not a category`); });
  });
  if (demos !== 1) errors.push(`expected exactly 1 demo thought, found ${demos}`);
  if (!demosAtTop) errors.push('the demo thought must be first in the array');
  if (stumbles !== 1) errors.push(`expected exactly 1 stumble thought, found ${stumbles}`);
  const cats = Array.from(catIds);
  cats.forEach(a => cats.forEach(b => { if (a !== b && !(c.coaching && c.coaching.wrong && c.coaching.wrong[`${a}>${b}`])) errors.push(`coaching.wrong missing key ${a}>${b}`); }));
  cats.forEach(id => { if (!c.emptyCategory || !c.emptyCategory[id]) errors.push(`emptyCategory missing line for ${id}`); });
  (c.notSure && c.notSure.questions || []).forEach(q => { if (!catIds.has(q.category)) errors.push(`notSure question category ${q.category} unknown`); });
  (function walk(v, path) {
    if (typeof v === 'string') { if (/[–—]/.test(v)) errors.push(`dash in copy at ${path}: "${v.slice(0, 50)}"`); }
    else if (Array.isArray(v)) v.forEach((x, i) => walk(x, `${path}[${i}]`));
    else if (v && typeof v === 'object') Object.keys(v).forEach(k => walk(v[k], path ? `${path}.${k}` : k));
  })(c, '');
  return { errors, warnings };
}

function todayLabel() { try { return new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return new Date().toISOString().slice(0, 10); } }
function nextStepLine() {
  const d = state.decision;
  if (d && d.id === 'spec') return C.review.doc.nextStepSpec;
  if (d && d.id) { const o = C.deliverable.options.find(x => x.id === d.id); return fmt(C.review.doc.nextStepOther, { deliverable: o ? o.label : d.id }); }
  return C.review.doc.nextStepUndecided;
}
function docModel() {
  const ents = entries();
  return {
    title: C.meta.docTitle, date: todayLabel(),
    sections: C.categories.map(c => ({ cat: c, items: ents[c.id].filter(e => e.kind !== 'decision'), decision: c.id === 'deliverable' ? decisionText() : null, emptyNote: state.emptyNotes[c.id] === true ? C.emptyCategory.leaveNote : null })),
    next: nextStepLine()

}
function buildMarkdown() {
  const m = docModel(); const L = [];
  L.push(`# ${m.title}`, `*${m.date}*`, '');
  m.sections.forEach(s => {
    L.push(`## ${s.cat.name}`);
    if (s.cat.id === 'unknowns') L.push(`*${C.review.doc.unknownsNote}*`);
    if (!s.items.length && !s.decision) L.push(`*${s.emptyNote || C.ui.unfiled}*`);
    s.items.forEach(e => { let line = `- ${e.text}`; if (e.either) line += ` *(${C.review.doc.eitherLabel})*`; if (e.flag) line += ` *(${e.flag})*`; L.push(line); });

    L.push('');

}
function buildDocNode() {

  m.sections.forEach(s => {

    if (s.cat.id === 'unknowns') sec.append(el('div', { class: 'note', text: `*${C.review.doc.unknownsNote}*` }));
    if (!s.items.length && !s.decision) sec.append(el('div', { class: 'empty', text: `*${s.emptyNote || C.ui.unfiled}*` }));

   keyboard
   ========================================================= */
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') {
    if (notsure.isOpen()) { notsure.close(); e.preventDefault(); }
    else if (notebook.wrap.classList.contains('is-open')) { notebook.toggle(); e.preventDefault(); }
    return;
  }
  if (e.key === 'Enter' && callout.isOpen() && callout.primary && document.activeElement !== callout.primary && !(document.activeElement && document.activeElement.closest('#callout'))) { callout.primary.click(); e.preventDefault(); return; }
  if (state && state.step === 'sort' && !callout.isOpen()) {
    if (/^[1-5]$/.test(e.key)) { const c = C.categories.find(x => x.key === e.key); if (c) { sort.choose(c.id); e.preventDefault(); } }
    else if (e.key === 'n' || e.key === 'N') { if (notsure.isOpen()) notsure.close(); else notsure.open(); e.preventDefault(); }
  }
});
